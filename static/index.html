<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chatbot Multiusuário – Equipe D</title>
<style>
  body { font-family: system-ui, sans-serif; background:#f3f4f6; margin:0; display:flex; justify-content:center; }
  #app { width:100%; max-width:720px; height:100vh; display:flex; flex-direction:column; background:#fff; }
  header { padding:12px 16px; background:#1e3a8a; color:#fff; }
  header small { opacity:.8; display:block; font-size:12px; margin-top:2px; word-break:break-all; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:8px; }
  .msg { max-width:80%; padding:8px 12px; border-radius:12px; white-space:pre-wrap; line-height:1.4; }
  .user { align-self:flex-end; background:#dbeafe; }
  .bot { align-self:flex-start; background:#f3f4f6; }
  .err { align-self:center; background:#fee2e2; color:#991b1b; }
  form { display:flex; gap:8px; padding:12px; border-top:1px solid #e5e7eb; }
  input { flex:1; padding:10px; border:1px solid #d1d5db; border-radius:8px; font-size:15px; }
  button { padding:10px 16px; border:0; border-radius:8px; background:#1e3a8a; color:#fff; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
</style>
</head>
<body>
<div id="app">
  <header>Chatbot Multiusuário <small id="sid">conectando…</small></header>
  <div id="log"></div>
  <form id="form">
    <input id="input" placeholder="Digite sua pergunta…" autocomplete="off" required maxlength="4000">
    <button id="send">Enviar</button>
  </form>
</div>
<script>
const log = document.getElementById('log'), input = document.getElementById('input'),
      send = document.getElementById('send'), sid = document.getElementById('sid');
let sessionId = null;

function add(text, cls) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls; d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight;
}

async function connect() {
  const r = await fetch('/sessions', { method: 'POST' });
  sessionId = (await r.json()).session_id;
  sid.textContent = 'Sessão: ' + sessionId;
}

document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const message = input.value.trim(); if (!message) return;
  add(message, 'user'); input.value = ''; send.disabled = true;
  try {
    const r = await fetch('/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId, message })
    });
    const data = await r.json();
    if (!r.ok) {
      if (r.status === 404) { await connect(); add('Sessão expirada; nova sessão criada. Reenvie a pergunta.', 'err'); }
      else add(data.detail || 'Erro', 'err');
    } else add(data.reply, 'bot');
  } catch { add('Falha de conexão com o servidor.', 'err'); }
  send.disabled = false; input.focus();
});

connect().catch(() => { sid.textContent = 'falha ao conectar'; });
</script>
</body>
</html>
